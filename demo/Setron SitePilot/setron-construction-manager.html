<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Setron Construction Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#131923;--mut:#6a7585;--line:#e3e7ee;--y:#f5a524;--y2:#e8890c;--r:#e5484d;--g:#1f9d6b;--b:#3b6ef5;--sh:0 1px 2px rgba(19,25,35,.04),0 8px 24px -8px rgba(19,25,35,.10);--shh:0 2px 4px rgba(19,25,35,.05),0 18px 40px -12px rgba(19,25,35,.20);--ease:cubic-bezier(.22,1,.36,1);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161c24;--ink:#e9edf2;--mut:#8b97a6;--line:#252e39;--sh:0 1px 2px #0006,0 8px 24px -8px #0008;--shh:0 18px 40px -12px #000c}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161c24;--ink:#e9edf2;--mut:#8b97a6;--line:#252e39;--sh:0 1px 2px #0006,0 8px 24px -8px #0008;--shh:0 18px 40px -12px #000c}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 'Plus Jakarta Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.02em}h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}
.app{display:flex;min-height:100vh}
nav{width:232px;background:linear-gradient(180deg,#121821,#0b0f15);color:#9aa6b6;padding:20px 12px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow:auto}
.logo{display:flex;gap:11px;align-items:center;padding:2px 8px 22px;color:#fff}
.logo i{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--y),var(--y2));color:#1a1203;font:800 18px/36px 'Plus Jakarta Sans';text-align:center;font-style:normal;box-shadow:0 6px 18px -4px rgba(245,165,36,.6)}
.logo span{font-weight:700;font-size:16px;line-height:1.15}.logo small{display:block;font-weight:500;font-size:11px;color:#7d8998;margin-top:2px}
nav a{display:block;padding:10px 12px;margin:2px 0;border-radius:10px;color:inherit;cursor:pointer;font-weight:500;position:relative;transition:background .25s var(--ease),color .25s,transform .25s var(--ease)}
nav a:hover{background:#ffffff0d;color:#fff;transform:translateX(3px)}
nav a.on{background:linear-gradient(90deg,rgba(245,165,36,.20),rgba(245,165,36,.04));color:#fff}
nav a.on::before{content:"";position:absolute;left:-12px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--y);animation:pop .4s var(--ease)}
nav button{margin:18px 4px 0;width:calc(100% - 8px);color:#9aa6b6;border-color:#ffffff1f}
main{flex:1;padding:30px 34px;min-width:0;max-width:1240px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s}
.grid>.card:hover,.kan .card:hover{transform:translateY(-4px);box-shadow:var(--shh);border-color:color-mix(in srgb,var(--y) 40%,var(--line))}
.stat{position:relative;overflow:hidden}.stat::after{content:"";position:absolute;right:-24px;top:-24px;width:84px;height:84px;border-radius:50%;background:radial-gradient(var(--y),transparent 70%);opacity:.22}
.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums}.stat span{color:var(--mut);font-size:13px;font-weight:500}
.bar{height:8px;background:color-mix(in srgb,var(--mut) 18%,transparent);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#5b86ff,var(--b));transition:width .8s var(--ease)}
.bar.g i{background:linear-gradient(90deg,#3cc791,var(--g))}.bar.r i{background:linear-gradient(90deg,#ff7a7e,var(--r))}.bar.y i{background:linear-gradient(90deg,#ffc659,var(--y2))}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;color:var(--c,var(--mut));background:color-mix(in srgb,var(--c,var(--mut)) 14%,transparent);white-space:nowrap}
.t-g{--c:var(--g)}.t-r{--c:var(--r)}.t-y{--c:var(--y2)}.t-b{--c:var(--b)}
button,select,input,textarea{font:inherit;color:inherit}
button{background:linear-gradient(180deg,#ffb83d,var(--y2));color:#1d1304;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer;box-shadow:0 6px 16px -6px rgba(232,137,12,.7),inset 0 1px 0 #ffffff55;transition:transform .2s var(--ease),box-shadow .25s,background .25s,border-color .25s}
button:hover{transform:translateY(-2px);box-shadow:0 10px 22px -8px rgba(232,137,12,.8),inset 0 1px 0 #ffffff55}button:active{transform:scale(.96)}
button.alt{background:transparent;border:1px solid var(--line);color:var(--ink);box-shadow:none}button.alt:hover{background:color-mix(in srgb,var(--mut) 10%,transparent);box-shadow:none}
button.sm{padding:4px 10px;font-size:13px;border-radius:8px}
:is(button,a,input,select):focus-visible{outline:3px solid color-mix(in srgb,var(--b) 55%,transparent);outline-offset:2px}
input,select,textarea{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;width:100%;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:0;border-color:var(--y);box-shadow:0 0 0 4px color-mix(in srgb,var(--y) 22%,transparent)}
.top select{width:auto}input[type=range]{accent-color:var(--y2);padding:0;border:0;background:none}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12.5px;color:var(--mut);font-weight:600}tr:last-child td,tr:last-child th{border-bottom:0}
tbody tr,table tr{transition:background .2s}table tr:hover td{background:color-mix(in srgb,var(--mut) 6%,transparent)}
.scroll{overflow-x:auto}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mut{color:var(--mut)}.sp{height:14px}
.tabs{display:flex;gap:6px;background:color-mix(in srgb,var(--mut) 12%,transparent);padding:5px;border-radius:12px;margin:16px 0 22px;overflow-x:auto;width:fit-content;max-width:100%}
.tabs a{padding:8px 16px;cursor:pointer;white-space:nowrap;border-radius:8px;font-weight:600;color:var(--mut);transition:all .3s var(--ease)}
.tabs a:hover{color:var(--ink)}.tabs a.on{background:var(--card);color:var(--ink);box-shadow:var(--sh)}
.kan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.kan>div{background:color-mix(in srgb,var(--mut) 9%,transparent);border-radius:16px;padding:12px;min-height:140px}.kan .card{margin-top:10px;padding:14px}
.tl{display:grid;grid-template-columns:110px 1fr 56px;gap:12px;align-items:center;margin:12px 0}
.photo{height:150px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:50px;background:linear-gradient(135deg,#1c2a3d,#34506f);background-image:linear-gradient(#ffffff12 1px,transparent 1px),linear-gradient(90deg,#ffffff12 1px,transparent 1px),linear-gradient(135deg,#1c2a3d,#34506f);background-size:22px 22px,22px 22px,auto}
dialog{border:1px solid var(--line);border-radius:20px;padding:24px;width:min(440px,92vw);background:var(--card);color:var(--ink);box-shadow:0 30px 80px -20px #000a}
dialog[open]{animation:dlg .35s var(--ease)}dialog::backdrop{background:#0a0e14aa;backdrop-filter:blur(5px);animation:fade .3s}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;background:#131923;color:#fff;padding:11px 20px;border-radius:12px;display:none;z-index:9;box-shadow:var(--shh);font-weight:500}
.toast.show{display:block;animation:toast .4s var(--ease) both}
.warn{color:var(--r);font-weight:600}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scaleY(0)}}
@keyframes dlg{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes toast{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes grow{from{width:0}}
main.enter>*{animation:rise .55s var(--ease) both}
main.enter .grid>*,main.enter .kan>div,main.enter .tl{animation:rise .6s var(--ease) both}
main.enter .grid>*:nth-child(1){animation-delay:.04s}main.enter .grid>*:nth-child(2){animation-delay:.09s}main.enter .grid>*:nth-child(3){animation-delay:.14s}main.enter .grid>*:nth-child(4){animation-delay:.19s}main.enter .grid>*:nth-child(5){animation-delay:.24s}main.enter .grid>*:nth-child(n+6){animation-delay:.3s}
main.enter .bar i{animation:grow 1s var(--ease) .15s both}
@media(max-width:760px){.app{flex-direction:column}nav{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:2px;padding:12px}.logo{width:100%;padding-bottom:10px}nav a{padding:7px 11px}nav a.on::before{display:none}nav button{width:auto}main{padding:18px 14px}.tl{grid-template-columns:84px 1fr 50px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style></head><body>

<script>
const SEED=document.getElementById('seed').textContent,STAGES=['Foundation','Structure','Electrical','Plumbing','Flooring','Painting'];
const CATS=['Materials','Labour','Equipment','Transportation','Contractor payments','Other expenses'];
let S;try{S=JSON.parse(localStorage.getItem('scm')||'null')}catch(e){}if(!S)S=JSON.parse(SEED);
const V={view:'dash',pid:null,tab:'Overview',f:0};
const save=()=>{try{localStorage.setItem('scm',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id),by=(a,pid)=>pid?a.filter(x=>x.pid==pid):a,sum=a=>a.reduce((s,x)=>s+x,0);
const nid=a=>1+Math.max(0,...a.map(x=>x.id)),P=id=>S.projects.find(p=>p.id==id),pn=id=>(P(id)||{}).name||'-';
const fmt=n=>n>=1e7?'₹'+(n/1e7).toFixed(2)+' Cr':n>=1e5?'₹'+(n/1e5).toFixed(1)+' Lakh':'₹'+n.toLocaleString('en-IN');
const prog=p=>Math.round(sum(p.stages)/p.stages.length),spent=pid=>sum(by(S.expenses,pid).map(e=>e.amt));
const stat=p=>prog(p)==100?['Completed','t-g']:p.delayed?['Delayed','t-r']:['On schedule','t-b'];
const bar=(v,c='')=>`<div class="bar ${c}"><i style="width:${Math.min(100,v)}%"></i></div>`;
const tag=(t,c)=>`<span class="tag ${c}">${t}</span>`;
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2000)};
const opts=(a,sel)=>a.map(o=>{const v=o.v??o,l=o.l??o;return`<option value="${v}" ${v==sel?'selected':''}>${l}</option>`}).join('');
const projOpts=()=>S.projects.map(p=>({v:p.id,l:p.name}));
const filt=()=>`<select onchange="V.f=+this.value;go()"><option value="0">All projects</option>${opts(projOpts(),V.f)}</select>`;
function form(title,fields,cb){
 $('frm').innerHTML=`<h3>${title}</h3>`+fields.map(f=>`<label>${f.l}</label>`+(f.o?`<select name="${f.k}">${opts(f.o,f.v)}</select>`:`<input name="${f.k}" type="${f.t||'text'}" value="${f.v??''}" required>`)).join('')+
 `<div class="row" style="margin-top:14px"><button value="ok">Save</button><button class="alt" value="x" formnovalidate>Cancel</button></div>`;
 $('frm').onsubmit=e=>{if(e.submitter&&e.submitter.value=='ok'){const d=Object.fromEntries(new FormData($('frm')));cb(d);save();go()}};
 $('dlg').showModal()}
function go(){
 const nav=[['dash','Dashboard'],['projects','Projects'],['tasks','Tasks'],['workers','Workers'],['materials','Materials'],['equipment','Equipment'],['expenses','Expenses'],['updates','Site Updates'],['reports','Reports']];
 $('nav').innerHTML=`<div class="logo"><i>S</i><span>Setron<small>Construction Manager</small></span></div>`+nav.map(n=>`<a tabindex=0 class="${V.view==n[0]?'on':''}" onclick="V.view='${n[0]}';V.pid=null;go()">${n[1]}</a>`).join('')+`<button class="alt" onclick="if(confirm('Reset demo data?')){S=JSON.parse(SEED);save();go();toast('Demo data reset')}">Reset demo data</button>`;
 const R={dash,projects:()=>V.pid?detail():projects(),tasks:()=>head('Tasks','addTask()')+tasks(V.f),workers:()=>head('Workers','addWorker()')+workers(V.f),materials:()=>head('Materials','addMat()')+mats(V.f),equipment:()=>head('Equipment','addEq()',1)+equip(),expenses:()=>head('Expenses','addExp()')+exps(V.f),updates:()=>head('Site Updates','addUpd()')+upds(V.f),reports:()=>head('Reports')+reports(V.f)};
 const key=V.view+'|'+V.pid+'|'+V.tab+'|'+V.f,ch=key!==go.k;go.k=key;const m=$('main');m.classList.remove('enter');m.innerHTML=R[V.view]();
 if(ch){void m.offsetWidth;m.classList.add('enter');window.scrollTo(0,0);countUp()}}
function countUp(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;document.querySelectorAll('.stat b').forEach(el=>{const t=el.textContent,m=t.match(/[\d,]*\.?\d+/);if(!m)return;const end=parseFloat(m[0].replace(/,/g,'')),dec=(m[0].split('.')[1]||'').length,t0=performance.now();const step=n=>{const k=Math.min(1,(n-t0)/1000),e=1-Math.pow(1-k,3);el.textContent=t.replace(m[0],(end*e).toFixed(dec));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function head(t,add,nf){return`<div class="top"><h1>${t}</h1><div class="row">${nf?'':filt()}${add?`<button onclick="${add}">+ Add</button>`:''}</div></div>`}
function dash(){
 const A=S.projects,done=A.filter(p=>prog(p)==100).length,del=A.filter(p=>p.delayed&&prog(p)<100).length;
 const st=[['🏗️ Active projects',A.length-done],['✅ Completed',done],['⏳ Delayed',del],['💰 Total budget',fmt(sum(A.map(p=>p.budget)))],['💸 Amount spent',fmt(spent())],['👷 Workers on site',S.workers.filter(w=>w.present).length+' / '+S.workers.length]];
 return`<div class="top"><h1>Construction Projects</h1><button onclick="V.view='projects';go()">All projects</button></div><div class="grid stats">${st.map(s=>`<div class="card stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('')}</div><div class="grid">${A.map(card).join('')}</div>`}
function card(p){const[s,c]=stat(p);return`<div class="card" style="cursor:pointer" onclick="openP(${p.id})"><div class="row" style="justify-content:space-between"><h3>${p.name}</h3>${tag(s,c)}</div><div class="mut">📍 ${p.loc} · ${p.client}</div><div class="sp"></div><div class="row" style="justify-content:space-between"><span>Progress</span><b>${prog(p)}%</b></div>${bar(prog(p),p.delayed?'r':'')}<div class="sp"></div><div class="row" style="justify-content:space-between"><span class="mut">Budget ${fmt(p.budget)}</span><span class="mut">Spent ${fmt(spent(p.id))}</span></div></div>`}
const openP=id=>{V.view='projects';V.pid=id;V.tab='Overview';go()};
function projects(){return head('Projects','addProject()',1)+`<div class="grid">${S.projects.map(card).join('')}</div>`}
function addProject(){form('New project',[{k:'name',l:'Project name'},{k:'client',l:'Client'},{k:'loc',l:'Site location'},{k:'pm',l:'Project manager'},{k:'start',l:'Start date',t:'date'},{k:'end',l:'Expected completion',t:'date'},{k:'budget',l:'Budget (₹)',t:'number'}],d=>{S.projects.push({id:nid(S.projects),...d,budget:+d.budget,delayed:false,stages:[0,0,0,0,0,0]});toast('Project added')})}
function detail(){
 const p=P(V.pid),[s,c]=stat(p),T=['Overview','Tasks','Materials','Workers','Expenses','Reports'];
 const body={Overview:()=>overview(p),Tasks:()=>`<div class="row" style="margin-bottom:10px"><button onclick="addTask(${p.id})">+ Add task</button></div>`+tasks(p.id),Materials:()=>`<div class="row" style="margin-bottom:10px"><button onclick="addMat(${p.id})">+ Add material</button></div>`+mats(p.id),Workers:()=>`<div class="row" style="margin-bottom:10px"><button onclick="addWorker(${p.id})">+ Add worker</button></div>`+workers(p.id),Expenses:()=>`<div class="row" style="margin-bottom:10px"><button onclick="addExp(${p.id})">+ Add expense</button></div>`+exps(p.id),Reports:()=>reports(p.id)}[V.tab]();
 return`<div class="top"><div><button class="alt sm" onclick="V.pid=null;go()">← Projects</button><h1>${p.name} ${tag(s,c)}</h1></div><div class="row"><button class="alt" onclick="toggleDelay(${p.id})">${p.delayed?'Mark on schedule':'Mark delayed'}</button><button class="alt" onclick="delP(${p.id})">Delete</button></div></div><div class="tabs">${T.map(t=>`<a tabindex=0 class="${V.tab==t?'on':''}" onclick="V.tab='${t}';go()">${t}</a>`).join('')}</div>${body}`}
const toggleDelay=id=>{P(id).delayed=!P(id).delayed;save();go()},delP=id=>{if(!confirm('Delete this project and its data?'))return;['tasks','workers','materials','equipment','expenses','updates'].forEach(k=>S[k]=S[k].filter(x=>x.pid!=id));S.projects=S.projects.filter(p=>p.id!=id);V.pid=null;save();go();toast('Project deleted')};
function overview(p){
 const sp=spent(p.id),rem=p.budget-sp;
 return`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Project information</h3><table>${[['Client',p.client],['Site',p.loc],['Start',p.start],['Expected completion',p.end],['Project manager',p.pm]].map(r=>`<tr><th>${r[0]}</th><td>${r[1]}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Budget</h3><div class="sp"></div>${bar(sp/p.budget*100,sp>p.budget?'r':'y')}<div class="sp"></div><table><tr><th>Budget</th><td>${fmt(p.budget)}</td></tr><tr><th>Spent</th><td>${fmt(sp)}</td></tr><tr><th>Remaining</th><td class="${rem<0?'warn':''}">${fmt(rem)}</td></tr><tr><th>Overall progress</th><td>${prog(p)}%</td></tr></table></div></div>
 <div class="card" style="margin-top:14px"><h3>Progress timeline</h3><div class="mut">Drag a slider to update a stage.</div>${STAGES.map((n,i)=>`<div class="tl"><span>${n}</span><input type="range" min="0" max="100" step="5" value="${p.stages[i]}" aria-label="${n} progress" oninput="this.parentNode.lastElementChild.textContent=this.value+'%'" onchange="P(${p.id}).stages[${i}]=+this.value;save();go()"><b>${p.stages[i]}%</b></div>`).join('')}</div>`}
function tasks(pid){
 const L=by(S.tasks,pid),cols=['Not Started','In Progress','Completed'];
 return`<div class="kan">${cols.map((c,ci)=>`<div><b>${c} (${L.filter(t=>t.status==c).length})</b>${L.filter(t=>t.status==c).map(t=>`<div class="card"><b>${t.name}</b><div class="mut">${t.team}${pid?'':' · '+pn(t.pid)}</div><div class="sp"></div>${bar(t.progress,t.status=='Completed'?'g':'')}<div class="row" style="justify-content:space-between;margin-top:6px"><span>${t.progress}%</span><span class="row">${ci>0?`<button class="alt sm" onclick="mvT(${t.id},${ci-1})" aria-label="Move back">◀</button>`:''}${ci<2?`<button class="alt sm" onclick="mvT(${t.id},${ci+1})" aria-label="Move forward">▶</button>`:''}<button class="alt sm" onclick="delItem('tasks',${t.id})" aria-label="Delete">🗑</button></span></div></div>`).join('')}</div>`).join('')}</div>`}
function mvT(id,ci){const t=S.tasks.find(x=>x.id==id);t.status=['Not Started','In Progress','Completed'][ci];t.progress=ci==0?0:ci==2?100:(t.progress>0&&t.progress<100?t.progress:50);save();go()}
function delItem(k,id){S[k]=S[k].filter(x=>x.id!=id);save();go();toast('Deleted')}
const pSel=pid=>pid?[]:[{k:'pid',l:'Project',o:projOpts()}];
const pidOf=(d,pid)=>+(pid||d.pid);
function addTask(pid){form('New task',[...pSel(pid||V.f),{k:'name',l:'Task'},{k:'team',l:'Assigned team'}],d=>{S.tasks.push({id:nid(S.tasks),pid:pidOf(d,pid||V.f),name:d.name,team:d.team,progress:0,status:'Not Started'})})}
function workers(pid){const L=by(S.workers,pid);return`<div class="card scroll"><table><tr><th>Name</th><th>Role</th>${pid?'':'<th>Project</th>'}<th>Phone</th><th>Daily wage</th><th>Attendance</th><th></th></tr>${L.map(w=>`<tr><td><b>${w.name}</b></td><td>${w.role}</td>${pid?'':`<td>${pn(w.pid)}</td>`}<td>${w.phone}</td><td>₹${w.wage}/day</td><td><button class="sm ${w.present?'':'alt'}" onclick="togW(${w.id})">${w.present?'Present':'Absent'}</button></td><td><button class="alt sm" onclick="delItem('workers',${w.id})" aria-label="Delete">🗑</button></td></tr>`).join('')||'<tr><td>No workers yet. Add one to start tracking attendance.</td></tr>'}</table><div class="sp"></div><b>Today's labour cost: ${fmt(sum(L.filter(w=>w.present).map(w=>w.wage)))}</b></div>`}
const togW=id=>{const w=S.workers.find(x=>x.id==id);w.present=!w.present;save();go()};
function addWorker(pid){form('New worker',[...pSel(pid||V.f),{k:'name',l:'Name'},{k:'role',l:'Role'},{k:'phone',l:'Phone'},{k:'wage',l:'Daily wage (₹)',t:'number'}],d=>{S.workers.push({id:nid(S.workers),pid:pidOf(d,pid||V.f),name:d.name,role:d.role,phone:d.phone,wage:+d.wage,present:true})})}
function mats(pid){return`<div class="grid">${by(S.materials,pid).map(m=>{const rem=m.req-m.used,low=rem/m.req<.2;return`<div class="card"><div class="row" style="justify-content:space-between"><h3>${m.name}</h3>${low?tag('Low stock','t-r'):''}</div>${pid?'':`<div class="mut">${pn(m.pid)}</div>`}<div class="sp"></div>${bar(m.used/m.req*100,low?'r':'')}<table><tr><th>Required</th><td>${m.req.toLocaleString('en-IN')} ${m.unit}</td></tr><tr><th>Used</th><td>${m.used.toLocaleString('en-IN')}</td></tr><tr><th>Remaining</th><td class="${low?'warn':''}">${rem.toLocaleString('en-IN')}</td></tr></table><div class="row"><button class="sm" onclick="useM(${m.id})">Log usage</button><button class="alt sm" onclick="delItem('materials',${m.id})">Delete</button></div></div>`}).join('')||'<div class="card">No materials yet.</div>'}</div>`}
function useM(id){const m=S.materials.find(x=>x.id==id);form('Log usage: '+m.name,[{k:'q',l:'Quantity used ('+m.unit+')',t:'number'}],d=>{m.used=Math.min(m.req,m.used+ +d.q);toast('Usage logged')})}
function addMat(pid){form('New material',[...pSel(pid||V.f),{k:'name',l:'Material'},{k:'unit',l:'Unit (bags, tons...)'},{k:'req',l:'Required quantity',t:'number'}],d=>{S.materials.push({id:nid(S.materials),pid:pidOf(d,pid||V.f),name:d.name,unit:d.unit,req:+d.req,used:0})})}
function equip(){return`<div class="grid">${S.equipment.map(e=>`<div class="card"><div class="row" style="justify-content:space-between"><h3>${e.name}</h3>${tag(e.status,e.status=='In Use'?'t-g':e.status=='Idle'?'t-b':'t-r')}</div><div class="mut">${pn(e.pid)}</div><table><tr><th>Hours</th><td>${e.hours}</td></tr><tr><th>Maintenance</th><td class="${/Due/.test(e.maint)?'warn':''}">${e.maint}</td></tr></table><div class="row"><select style="width:auto" onchange="setEq(${e.id},this.value)" aria-label="Status">${opts(['In Use','Idle','Maintenance'],e.status)}</select><button class="sm" onclick="hrs(${e.id})">+8 hrs</button><button class="alt sm" onclick="delItem('equipment',${e.id})">Delete</button></div></div>`).join('')}</div>`}
const setEq=(id,v)=>{const e=S.equipment.find(x=>x.id==id);e.status=v;e.maint=v=='Maintenance'?'In workshop':e.maint=='In workshop'?'OK':e.maint;save();go()},hrs=id=>{S.equipment.find(x=>x.id==id).hours+=8;save();go()};
function addEq(){form('New equipment',[{k:'pid',l:'Project',o:projOpts()},{k:'name',l:'Equipment (e.g. JCB-05)'},{k:'hours',l:'Hours used',t:'number'}],d=>{S.equipment.push({id:nid(S.equipment),pid:+d.pid,name:d.name,status:'Idle',hours:+d.hours,maint:'OK'})})}
function exps(pid){
 const L=by(S.expenses,pid),tot=sum(L.map(e=>e.amt)),by_c=CATS.map(c=>[c,sum(L.filter(e=>e.cat==c).map(e=>e.amt))]),mx=Math.max(1,...by_c.map(x=>x[1]));
 const bud=pid?P(pid).budget:sum(S.projects.map(p=>p.budget));
 return`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(300px,1fr))"><div class="card"><h3>Budget</h3><div class="sp"></div>${bar(tot/bud*100,tot>bud?'r':'y')}<table><tr><th>Budget</th><td>${fmt(bud)}</td></tr><tr><th>Spent</th><td>${fmt(tot)}</td></tr><tr><th>Remaining</th><td class="${bud<tot?'warn':''}">${fmt(bud-tot)}</td></tr></table></div>
 <div class="card"><h3>By category</h3>${by_c.map(c=>`<div class="tl" style="grid-template-columns:130px 1fr 80px"><span>${c[0]}</span>${bar(c[1]/mx*100)}<b>${fmt(c[1])}</b></div>`).join('')}</div></div>
 <div class="card scroll" style="margin-top:14px"><table><tr><th>Date</th><th>Category</th><th>Description</th>${pid?'':'<th>Project</th>'}<th>Amount</th><th></th></tr>${[...L].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${e.date}</td><td>${e.cat}</td><td>${e.desc}</td>${pid?'':`<td>${pn(e.pid)}</td>`}<td>${fmt(e.amt)}</td><td><button class="alt sm" onclick="delItem('expenses',${e.id})" aria-label="Delete">🗑</button></td></tr>`).join('')}</table></div>`}
function addExp(pid){form('New expense',[...pSel(pid||V.f),{k:'cat',l:'Category',o:CATS},{k:'desc',l:'Description'},{k:'amt',l:'Amount (₹)',t:'number'},{k:'date',l:'Date',t:'date',v:new Date().toISOString().slice(0,10)}],d=>{S.expenses.push({id:nid(S.expenses),pid:pidOf(d,pid||V.f),cat:d.cat,desc:d.desc,amt:+d.amt,date:d.date})})}
function upds(pid){return`<div class="grid">${by(S.updates,pid).sort((a,b)=>b.date.localeCompare(a.date)).map(u=>`<div class="card"><div class="photo" role="img" aria-label="Site photo">${u.icon}</div><div class="sp"></div><b>Site progress: ${u.date}</b><div class="mut">${pn(u.pid)}</div><p>${u.text}</p>${bar(u.progress)}<div class="row" style="justify-content:space-between;margin-top:6px"><span>${u.progress}% complete</span><button class="alt sm" onclick="delItem('updates',${u.id})">Delete</button></div></div>`).join('')||'<div class="card">No updates yet. Post the first site update.</div>'}</div>`}
function addUpd(){form('Post site update',[{k:'pid',l:'Project',o:projOpts(),v:V.f},{k:'date',l:'Date',t:'date',v:new Date().toISOString().slice(0,10)},{k:'text',l:'Description'},{k:'progress',l:'Progress % at this date',t:'number'},{k:'icon',l:'Photo',o:['🏗️','🧱','🔩','⚡','🚧','🎨']}],d=>{S.updates.push({id:nid(S.updates),pid:+d.pid,date:d.date,text:d.text,progress:Math.min(100,+d.progress),icon:d.icon})})}
function reports(pid){
 const PL=pid?[P(pid)]:S.projects,w=by(S.workers,pid),late=by(S.tasks,pid).filter(t=>t.status!='Completed'&&P(t.pid).delayed);
 const R=(t,h)=>`<div class="card scroll"><h3>${t}</h3>${h}</div>`;
 return`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
 ${R('Project progress','<table>'+PL.map(p=>`<tr><td>${p.name}</td><td style="width:40%">${bar(prog(p))}</td><td>${prog(p)}%</td></tr>`).join('')+'</table>')}
 ${R('Budget vs actual','<table>'+PL.map(p=>`<tr><td>${p.name}</td><td>${fmt(p.budget)}</td><td class="${spent(p.id)>p.budget?'warn':''}">${fmt(spent(p.id))}</td></tr>`).join('')+'</table>')}
 ${R('Material usage','<table>'+by(S.materials,pid).map(m=>`<tr><td>${m.name}${pid?'':' <span class=mut>('+pn(m.pid)+')</span>'}</td><td>${Math.round(m.used/m.req*100)}%</td><td>${m.used}/${m.req} ${m.unit}</td></tr>`).join('')+'</table>')}
 ${R('Labour costs (per day)',`<table><tr><td>Workers present</td><td>${w.filter(x=>x.present).length} of ${w.length}</td></tr><tr><td>Daily cost</td><td>${fmt(sum(w.filter(x=>x.present).map(x=>x.wage)))}</td></tr><tr><td>Monthly estimate (26 days)</td><td>${fmt(26*sum(w.filter(x=>x.present).map(x=>x.wage)))}</td></tr></table>`)}
 ${R('Delayed tasks',late.length?'<table>'+late.map(t=>`<tr><td>${t.name}</td><td>${pn(t.pid)}</td><td>${t.progress}%</td></tr>`).join('')+'</table>':'<span class="mut">No delayed tasks.</span>')}
 ${R('Project completion','<table>'+PL.map(p=>`<tr><td>${p.name}</td><td>Due ${p.end}</td><td>${tag(...stat(p))}</td></tr>`).join('')+'</table>')}</div>`}
go();
</script></body></html>
