aside nav a:hover{background:rgba(255,255,255,.07)}

<script>
(async function(){'use strict';
let DATA;
try{if(location.protocol==='file:')throw new Error('file');const res=await fetch('data.json',{cache:'no-cache'});if(!res.ok)throw new Error('HTTP '+res.status);DATA=await res.json()}
catch(err){
 // Opened straight from disk (file://), where fetch is blocked: fall back to data.js, which holds the same JSON
 DATA=await new Promise(ok=>{const s=document.createElement('script');s.src='data.js';s.onload=()=>ok(window.GRIDSENSE_DATA||null);s.onerror=()=>ok(null);document.head.appendChild(s)});
 if(!DATA){document.getElementById('view').innerHTML='<div class="card empty"><b>Could not load the demo data</b><br>Keep <code>data.json</code> and <code>data.js</code> in the same folder as <code>index.html</code>, or run <code>node generate-data.js</code> to recreate them.</div>';return}
}
const [PY,PM]=DATA.meta.period.split('-').map(Number),MO=PM-1;
/* =====================================================================
   DATA: ~3,600 fictional hourly readings (5 locations x 30 days x 24 h)
   plus 24 months of history. Everything is seeded, so it is repeatable.
   ===================================================================== */
const M=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAYS=30;
const date=d=>new Date(PY,MO,1+d);
const dayLbl=d=>{const t=date(d);return t.getDate()+' '+M[t.getMonth()]};
const hr=h=>{h=((h%24)+24)%24;return (h%12===0?12:h%12)+':00 '+(h<12?'AM':'PM')};
const hrRange=(h,n)=>hr(h)+'–'+hr(h+n);
const sum=a=>a.reduce((x,y)=>x+y,0);

const B=DATA.locations.map(l=>({id:l.id,name:l.name,short:l.short,eff:l.efficiency,area:l.area_m2,color:l.color,eq:l.equipment}));
const BI=Object.fromEntries(B.map((b,i)=>[b.id,i]));
const EQ=[
 {k:'hvac',n:'HVAC',c:'#0F8E98'},{k:'prod',n:'Production machinery',c:'#C2547A'},{k:'server',n:'Servers',c:'#5B73D6'},
 {k:'chill',n:'Chillers',c:'#4C93C9'},{k:'light',n:'Lighting',c:'#E0A21B'},{k:'comp',n:'Compressors',c:'#7A8F3A'},
 {k:'pump',n:'Pumps',c:'#5DA39B'},{k:'other',n:'Other',c:'#98A6AC'}];
const EQN=Object.fromEntries(EQ.map(e=>[e.k,e.n]));
const EQC=Object.fromEntries(EQ.map(e=>[e.k,e.c]));
const R=[];
const RI=Array.from({length:DAYS},()=>Array.from({length:24},()=>Array(B.length)));
DATA.readings.forEach(x=>{const d=+x.t.slice(8,10)-1,h=+x.t.slice(11,13),b=BI[x.loc],dow=date(d).getDay();
 const r={d,h,b,dow,we:dow===0||dow===6,kwh:x.kwh};R.push(r);RI[d][h][b]=r});
const TOT=RI.map(day=>day.map(hs=>sum(hs.map(r=>r.kwh))));   // site kWh per hour (= average kW)
const DAYT=TOT.map(sum);
const TOTAL=sum(DAYT);
const BT=B.map((_,i)=>sum(R.filter(r=>r.b===i).map(r=>r.kwh)));

// Baselines for anomaly detection: median and MAD per location, hour of day and weekday/weekend
const med=a=>{const s=[...a].sort((x,y)=>x-y),n=s.length,m=n>>1;return n%2?s[m]:(s[m-1]+s[m])/2};
const grp={};
R.forEach(r=>{(grp[r.b+'|'+(r.we?1:0)+'|'+r.h]=grp[r.b+'|'+(r.we?1:0)+'|'+r.h]||[]).push(r)});
Object.values(grp).forEach(g=>{
 const vs=g.map(r=>r.kwh),m=med(vs),mad=med(vs.map(v=>Math.abs(v-m))),sg=Math.max(1.4826*mad,0.02*m);
 g.forEach(r=>{r.base=m;r.sg=sg;r.z=(r.kwh-m)/sg;r.lo=m-2.5*sg;r.hi=m+2.5*sg});
});

// Equipment split (estimated): each location's fixed mix, nudged by time of day
const eqCache={};
function EQF(b,h){
 const key=b*100+h;if(eqCache[key])return eqCache[key];
 const w={};let s=0;
 EQ.forEach(e=>{let x=B[b].eq[e.k]||0;
  if(e.k==='hvac'||e.k==='chill')x*=0.75+0.6*Math.exp(-((h-15)**2)/18);
  if(e.k==='light')x*=(h<6||h>=22)?0.7:1.05;
  w[e.k]=x;s+=x});
 EQ.forEach(e=>w[e.k]/=s);
 return eqCache[key]=w;
}
const EQT={},EQDAY={},EQHR={},EQB={};
EQ.forEach(e=>{EQT[e.k]=0;EQDAY[e.k]=Array(DAYS).fill(0);EQHR[e.k]=Array(24).fill(0);EQB[e.k]=Array(B.length).fill(0)});
R.forEach(r=>{const f=EQF(r.b,r.h);EQ.forEach(e=>{const v=r.kwh*f[e.k];EQT[e.k]+=v;EQDAY[e.k][r.d]+=v;EQHR[e.k][r.h]+=v/DAYS;EQB[e.k][r.b]+=v})});

// Monthly history, Oct 2024 to Sep 2026
const MONTHLY=DATA.history.map(h=>h.kwh);
MONTHLY[23]=TOTAL;
const mLabel=i=>{const m=(9+i)%12,y=2024+Math.floor((9+i)/12);return M[m]+' '+String(y).slice(2)};
const SOLSH=DATA.history.slice(12).map(h=>h.solar_share);
const EF=DATA.meta.emission_factor_kg_per_kwh; // kg CO2 per grid kWh, illustrative
const EFF=sum(B.map((b,i)=>b.eff*BT[i]))/TOTAL, EFF0=EFF-1.2;

// Solar: 72,400 kWh over the month, shaped by a daily sun curve and cloudy days
const SOL=Array.from({length:DAYS},()=>Array(24).fill(0));
DATA.solar.forEach(x=>{SOL[+x.t.slice(8,10)-1][+x.t.slice(11,13)]=x.kwh});
const SOLDAY=SOL.map(sum),SOLTOT=sum(SOLDAY);
SOLSH[11]=SOLTOT/TOTAL;
const EXC=SOL.map((day,d)=>day.map((v,h)=>Math.max(0,v-TOT[d][h])));
const EXCDAY=EXC.map(sum),EXCTOT=sum(EXCDAY);
const GRIDNET=TOTAL-SOLTOT;
const co2=kwh=>kwh*EF/1000;

// Peak and profile helpers
const WD=Array(24).fill(0),WE=Array(24).fill(0);
{let nd=0,ne=0;for(let d=0;d<DAYS;d++){const w=date(d).getDay();const we=w===0||w===6;we?ne++:nd++;for(let h=0;h<24;h++)(we?WE:WD)[h]+=TOT[d][h]}
 for(let h=0;h<24;h++){WD[h]/=nd;WE[h]/=ne}}
let MAXH={v:0,d:0,h:0};
for(let d=0;d<DAYS;d++)for(let h=0;h<24;h++)if(TOT[d][h]>MAXH.v)MAXH={v:TOT[d][h],d,h};
function peakWin(n){let best=-1,bh=0;for(let h=0;h<=24-n;h++){const s=sum(WD.slice(h,h+n));if(s>best){best=s;bh=h}}return bh}
const OPH=B.map((_,i)=>{const m=BT[i]/(DAYS*24);return R.filter(r=>r.b===i&&r.kwh>0.7*m).length});
const NIGHT_SHARE=sum(R.filter(r=>r.h<6).map(r=>r.kwh))/TOTAL;

// State
const S={rate:DATA.meta.tariff_per_kwh,k:4,up:.25,pw:2,sel:{b:null,e:null,a:null},fc:'base',
 c:{g:'daily',range:30,b:'all',eq:'all',tb:'all'}};
const events=()=>R.filter(r=>r.z>S.k&&r.kwh>(1+S.up)*r.base).sort((a,b)=>a.d-b.d||a.h-b.h);
const ek=r=>r.d+'-'+r.h+'-'+r.b;

// Forecast: weekday pattern from this month, scaled by damped recent month-on-month growth
const SC={base:{n:'Baseline',m:1},eff:{n:'Efficiency drive (−6%)',m:.94},heat:{n:'Hot month (+5%)',m:1.05}};
function forecast(sc){
 const byDow=Array.from({length:7},()=>[]);DAYT.forEach((v,d)=>byDow[date(d).getDay()].push(v));
 const mean=byDow.map(a=>sum(a)/a.length);
 const res=DAYT.map((v,d)=>v-mean[date(d).getDay()]);
 const sd=Math.sqrt(sum(res.map(x=>x*x))/(res.length-1));
 const g=([21,22,23].map(i=>MONTHLY[i]/MONTHLY[i-1]-1).reduce((a,b)=>a+b,0)/3)*0.9;
 const days=Array.from({length:30},(_,i)=>{const t=new Date(2026,9,1+i);
  const p=mean[t.getDay()]*(1+g)*SC[sc].m,w=1.64*sd*Math.sqrt(1+i/15);
  return{t,p,lo:p-w,hi:p+w}});
 const total=sum(days.map(x=>x.p));
 return{days,total,g,growth:total/TOTAL-1,sd};
}

/* =====================================================================
   UI
   ===================================================================== */
/*__UI__*/
const $=s=>document.querySelector(s);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt=n=>Math.round(n).toLocaleString('en-US');
const f1=n=>n.toLocaleString('en-US',{minimumFractionDigits:1,maximumFractionDigits:1});
const inr=n=>'₹'+(Math.abs(n)>=1e5?(n/1e5).toFixed(1)+' lakh':Math.round(n).toLocaleString('en-IN'));
const inrL=n=>'₹'+(n/1e5).toFixed(1)+'L';
const pct=(n,d=1)=>(n*100).toFixed(d)+'%';
const sgn=n=>(n>=0?'+':'−')+Math.abs(n).toFixed(1)+'%';
const alpha=(hex,al)=>hex+Math.round(al*255).toString(16).padStart(2,'0');
const words=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
const dtl=(d,h)=>DOW[date(d).getDay()]+' '+dayLbl(d)+', '+hr(h);

if(typeof Chart==='undefined'){
 document.getElementById('view').innerHTML='<div class="card empty">The chart library could not be loaded. Check your internet connection and reload.</div>';

const TB={all:[0,24],night:[0,6],morning:[6,12],afternoon:[12,18],evening:[18,24]};
function fv(r){const c=S.c,t=TB[c.tb];if(r.h<t[0]||r.h>=t[1])return 0;if(c.b!=='all'&&r.b!==+c.b)return 0;return r.kwh*(c.eq==='all'?1:EQF(r.b,r.h)[c.eq])}
const weekOf=d=>Math.floor((d+(date(0).getDay()+6)%7)/7);
function consSeries(){
 const c=S.c,d0=DAYS-c.range,bs=c.b==='all'?B.map((_,i)=>i):[+c.b],t=TB[c.tb];
 if(c.g==='hourly'){const labels=[],keys=[],vals=[];
  for(let d=d0;d<DAYS;d++)for(let h=0;h<24;h++){labels.push(dayLbl(d)+' '+hr(h));keys.push({d0:d,d1:d,h0:h,h1:h+1});
   vals.push(h>=t[0]&&h<t[1]?+sum(bs.map(b=>fv(RI[d][h][b]))).toFixed(1):null)}
  return{labels,keys,sets:[{label:'Site load',data:vals,color:'#0F8E98'}],bs};}
 if(c.g==='daily'){const labels=[],keys=[];for(let d=d0;d<DAYS;d++){labels.push(dayLbl(d));keys.push({d0:d,d1:d,h0:0,h1:24})}
  return{labels,keys,bs,sets:bs.map(b=>({label:B[b].short,color:B[b].color,data:keys.map(k=>+sum([...Array(24).keys()].map(h=>fv(RI[k.d0][h][b]))).toFixed(1))}))};}
 const wk={};for(let d=d0;d<DAYS;d++){(wk[weekOf(d)]=wk[weekOf(d)]||[]).push(d)}
 const ws=Object.values(wk),keys=ws.map(a=>({d0:a[0],d1:a[a.length-1],h0:0,h1:24})),
  labels=ws.map(a=>'From '+dayLbl(a[0])+(a.length<7?' ('+a.length+' d)':''));
 return{labels,keys,bs,sets:bs.map(b=>({label:B[b].short,color:B[b].color,data:keys.map(k=>{let s=0;for(let d=k.d0;d<=k.d1;d++)for(let h=0;h<24;h++)s+=fv(RI[d][h][b]);return +s.toFixed(1)})}))};
}
function detailRange(k,title,sub){

  for(let d=k.d0;d<=k.d1;d++)for(let h=k.h0;h<k.h1;h++){const r=RI[d][h][bi];v+=fv(r);full+=r.kwh;if(r.z>S.k&&r.kwh>(1+S.up)*r.base)flag++;rr=r}
  return{bi,v,full,flag,rr}}).filter(r=>S.c.b==='all'||r.bi===+S.c.b);
 const tot=sum(rows.map(r=>r.v)),single=k.d0===k.d1&&k.h1-k.h0===1,eqOn=S.c.eq==='all';
 let pk={v:-1,d:0,h:0};
 if(!single)for(let d=k.d0;d<=k.d1;d++)for(let h=k.h0;h<k.h1;h++){const v=sum(rows.map(r=>fv(RI[d][h][r.bi])));if(v>pk.v)pk={v,d,h}}
 const eq={};EQ.forEach(e=>eq[e.k]=0);

 $('#heat').innerHTML=hh;
 $('#heat').onclick=e=>{const c=e.target.closest('.hc');if(c)$('#hcOut').innerHTML=`<b>${c.dataset.l}</b>: average ${c.dataset.v} kW`};
 chart('cPk',{type:'line',data:{labels:[...Array(24).keys()].map(hr),datasets:[{label:'Weekday',data:WD.map(v=>+v.toFixed(1)),borderColor:'#0F8E98',backgroundColor:alpha('#0F8E98',.12),fill:true,pointRadius:0,borderWidth:2.2,tension:.3}]},
  options:base({plugins:{bands:{list:[{from:h0,to:h0+n-1,color:'rgba(240,168,27,.25)'}]}},scales:{x:{ticks:{maxTicksLimit:8}},y:ytitle('kW')}})});
 chart('cPd',{type:'bar',data:{labels:order.map(w=>DOW[w]),datasets:[{data:order.map(w=>Math.round(dm[w])),backgroundColor:order.map(w=>w===bestDow?'#E0A21B':alpha('#0F8E98',.6)),borderRadius:3}]},options:base({scales:{y:ytitle('kWh per day')}})});
};

/* ---------- Anomalies ---------- */
PG.anomalies=()=>{
 $('#view').innerHTML=`<div class="bar"><label><span>Sensitivity: flag readings more than <b id="kOut">${S.k.toFixed(1)}</b> deviations above normal</span><input type="range" id="kR" min="2" max="8" step="0.5" value="${S.k}" style="width:min(340px,80vw)"></label>
  <label>Minimum increase<select id="uS">${[[.10,'10% above normal'],[.25,'25% above normal'],[.50,'50% above normal']].map(x=>`<option value="${x[0]}" ${S.up===x[0]?'selected':''}>${x[1]}</option>`).join('')}</select></label></div><div id="anOut"></div>`+
  foot('Method: for each location, hour of day and weekday/weekend type, the system takes the median reading and the median absolute deviation across the month. A reading is flagged when it is far above that baseline (robust z-score) and also exceeds the minimum increase. Normal range shown is the median plus or minus 2.5 deviations.');
 $('#kR').oninput=e=>{S.k=+e.target.value;$('#kOut').textContent=S.k.toFixed(1);drawAn()};
 $('#uS').onchange=e=>{S.up=+e.target.value;drawAn()};
 drawAn();
};
function drawAn(){
 killCharts();
 const ev=events();let sel=ev.find(r=>ek(r)===S.sel.a)||ev[0];
 const left=`<div class="card"><h2>${ev.length} abnormal consumption event${ev.length===1?'':'s'}</h2><div class="sub">Select one to compare it with normal.</div><div style="max-height:560px;overflow:auto">`+
  (ev.length?ev.map(r=>`<button class="ev ${sel&&ek(r)===ek(sel)?'on':''}" data-k="${ek(r)}"><b><span class="dot" style="background:${B[r.b].color}"></span>${B[r.b].short}, ${hr(r.h)}</b><span>${DOW[date(r.d).getDay()]} ${dayLbl(r.d)} · ${f1(r.kwh)} kWh · ${sgn((r.kwh/r.base-1)*100)} vs typical</span></button>`).join(''):'<div class="empty">No readings exceed these thresholds. Lower the sensitivity to see more.</div>')+`</div></div>`;
 let right='';
 if(sel){const ex=sel.kwh-sel.base;
  right=card('Unusual consumption detected',`${B[sel.b].name} · ${dtl(sel.d,sel.h)}`,
   `<div class="facts"><div class="bad"><em>Consumption</em><strong>${f1(sel.kwh)} kWh</strong></div><div><em>Normal range</em><strong>${f1(sel.lo)}–${f1(sel.hi)} kWh</strong></div><div class="bad"><em>Difference vs typical</em><strong>${sgn((sel.kwh/sel.base-1)*100)}</strong></div><div><em>Extra energy</em><strong>${f1(ex)} kWh</strong></div><div><em>Extra cost</em><strong>${inr(ex*S.rate)}</strong></div></div>`+box('cAn',300)+
   `<p class="sub" style="margin:10px 0 0">The shaded band is the normal range for this hour. The line shows that day, hour by hour.</p>`);}
 $('#anOut').innerHTML=`<div class="g12">${left}<div>${right||card('Nothing to inspect','','<div class="empty">Choose a flagged reading, or lower the sensitivity.</div>')}</div></div>`;
 document.querySelectorAll('#anOut .ev[data-k]').forEach(b=>b.onclick=()=>{S.sel.a=b.dataset.k;drawAn()});
 if(!sel)return;
 const hrs=[...Array(24).keys()],row=hrs.map(h=>RI[sel.d][h][sel.b]);
 chart('cAn',{type:'line',data:{labels:hrs.map(hr),datasets:[
  {label:'Normal low',data:row.map(r=>+r.lo.toFixed(1)),borderColor:'transparent',pointRadius:0,fill:false},
  {label:'Normal range',data:row.map(r=>+r.hi.toFixed(1)),borderColor:'transparent',backgroundColor:'rgba(15,142,152,.16)',pointRadius:0,fill:'-1'},
  {label:'Typical',data:row.map(r=>+r.base.toFixed(1)),borderColor:'#5B7078',borderDash:[5,4],borderWidth:1.5,pointRadius:0},
  {label:'Actual',data:row.map(r=>+r.kwh.toFixed(1)),borderColor:css('--ink'),borderWidth:2.2,tension:.15,pointRadius:row.map((r,h)=>h===sel.h?7:2),pointBackgroundColor:row.map((r,h)=>h===sel.h?'#D8443B':css('--ink')),pointBorderColor:css('--panel'),pointBorderWidth:row.map((r,h)=>h===sel.h?2:0)}]},
  options:base({plugins:{legend:{display:true,labels:{filter:i=>i.text!=='Normal low'}}},scales:{x:{ticks:{maxTicksLimit:8}},y:ytitle('kWh per hour')}})});
}

/* ---------- Cost ---------- */
PG.cost=()=>{
 $('#view').innerHTML=card('Cost simulator','Change the electricity rate and every figure on this page, and across the demo, recalculates.',
  `<div class="rate"><input type="range" id="rR" min="5" max="14" step="0.25" value="${S.rate}" aria-label="Electricity rate in rupees per kWh"><output id="rO"></output><button class="btn" id="rX">Reset to ₹8.00</button></div>`,'stack')+`<div id="coOut"></div>`+
  foot('Cost is kWh multiplied by a flat tariff. “Operating hour” means an hour when a location draws more than 70% of its average load. History and forecast costs use the tariff selected here.');
 $('#rR').oninput=e=>{S.rate=+e.target.value;drawCost()};
 $('#rX').onclick=()=>{S.rate=8;$('#rR').value=8;drawCost()};
 drawCost();
};
function drawCost(){
 killCharts();
 const r=S.rate,cost=TOTAL*r,base8=TOTAL*8,F=forecast(S.fc);
 $('#rO').textContent='₹'+r.toFixed(2)+'/kWh';
 const dc=DAYT.map(v=>Math.round(v*r));
 $('#coOut').innerHTML=`<div class="kpis">`+
  kpi('Estimated monthly bill',inr(cost),r===8?'at the demo tariff':(cost>=base8?'<span class="up">+':'<span class="down">−')+inr(Math.abs(cost-base8))+' vs ₹8.00</span>','#E0A21B')+
  kpi('Average daily cost',inr(cost/DAYS),'September 2026','#0F8E98')+
  kpi('Cost per operating hour',inr(cost/sum(OPH)*5),'average across locations','#4C93C9')+
  kpi('Estimated next 30 days',inr(F.total*r),fmt(F.total)+' kWh projected','#6A5BB0','#forecast')+
  kpi('Bill after solar offset',inr(GRIDNET*r),'net of '+fmt(SOLTOT)+' kWh generated','#F0A81B','#solar')+`</div>`+
  `<div class="g21">`+card('Daily cost','Rupees per day',box('cD',280))+card('Cost by location','',box('cL',280))+`</div>`+
  `<div class="g2">`+card('Cost by equipment','Estimated split',box('cE',280))+card('Cost per operating hour','Rupees, by location',box('cO',280))+`</div>`+
  card('Cost trend','Monthly kWh priced at the selected tariff; the last bar is the 30-day projection',box('cT',280));
 chart('cD',{type:'bar',data:{labels:dc.map((_,d)=>dayLbl(d)),datasets:[{data:dc,backgroundColor:alpha('#E0A21B',.85),borderRadius:3}]},options:base({scales:{x:{ticks:{maxTicksLimit:10}},y:ytitle('₹')}})});
 const ord=B.map((_,i)=>i).sort((a,b)=>BT[b]-BT[a]);
 chart('cL',{type:'bar',data:{labels:ord.map(i=>B[i].short),datasets:[{data:ord.map(i=>Math.round(BT[i]*r)),backgroundColor:ord.map(i=>B[i].color),borderRadius:3}]},options:base({indexAxis:'y',scales:{y:{grid:{display:false}},x:Object.assign({grid:{color:css('--grid')}},ytitle('₹'))}})});
 const eo=EQ.slice().sort((a,b)=>EQT[b.k]-EQT[a.k]);
 chart('cE',{type:'bar',data:{labels:eo.map(e=>e.n),datasets:[{data:eo.map(e=>Math.round(EQT[e.k]*r)),backgroundColor:eo.map(e=>e.c),borderRadius:3}]},options:base({indexAxis:'y',scales:{y:{grid:{display:false}},x:Object.assign({grid:{color:css('--grid')}},ytitle('₹'))}})});
 chart('cO',{type:'bar',data:{labels:B.map(b=>b.short),datasets:[{data:B.map((_,i)=>Math.round(BT[i]*r/OPH[i])),backgroundColor:B.map(b=>b.color),borderRadius:3}]},options:base({scales:{y:ytitle('₹ per operating hour')}})});
 const labs=[...MONTHLY.slice(12).map((_,i)=>mLabel(i+12)),'Next 30 days'],vals=[...MONTHLY.slice(12).map(x=>Math.round(x*r)),Math.round(F.total*r)];
 chart('cT',{type:'bar',data:{labels:labs,datasets:[{data:vals,backgroundColor:vals.map((_,i)=>i===12?alpha('#6A5BB0',.8):i===11?'#0F8E98':alpha('#0F8E98',.45)),borderRadius:3}]},options:base({scales:{y:ytitle('₹')}})});
}

/* ---------- Solar & grid ---------- */
PG.solar=()=>{
 const used=SOLTOT-EXCTOT,excHrs=EXC.reduce((a,d)=>a+d.filter(v=>v>0.5).length,0);
 let peakSol=0;SOL.forEach(d=>d.forEach(v=>{if(v>peakSol)peakSol=v}));
 const hrAvg=(fn)=>[...Array(24).keys()].map(h=>+(sum([...Array(DAYS).keys()].map(d=>fn(d,h)))/DAYS).toFixed(1));
 $('#view').innerHTML=`<div class="kpis">`+
  kpi('Total consumption',fmt(TOTAL)+' kWh','all locations','#0F8E98')+
  kpi('Solar generation',fmt(SOLTOT)+' kWh','peak '+Math.round(peakSol)+' kW at midday','#F0A81B')+
  kpi('Grid consumption',fmt(GRIDNET)+' kWh','net of solar generation','#5B73D6')+
  kpi('Solar contribution',pct(SOLTOT/TOTAL),'of total consumption','#1E8A5A')+
  kpi('Excess generation',fmt(EXCTOT)+' kWh',excHrs+' hours with more solar than load','#E0A21B')+`</div>`+
  `<div class="g2">`+card('Average day: load, solar and grid draw','kWh per hour',box('cS1',280))+card('Daily solar and grid','Stacked kWh, together they equal the day’s consumption',box('cS2',280))+`</div>`+
  `<div class="g2">`+card('Solar contribution by day','Share of the day’s consumption covered by solar',box('cS3',260))+card('Excess generation by day','kWh of solar above the load, mostly weekends',box('cS4',260))+`</div>`+
  card('Monthly comparison','Solar and grid kWh, last 12 months',box('cS5',280))+
  foot(`Net-metered view: grid consumption is total consumption minus solar generation. About ${fmt(used)} kWh of solar is used on site at the moment it is generated; the rest is exported. Fictional 480 kW rooftop installation.`);
 const hrs=[...Array(24).keys()].map(hr);
 chart('cS1',{type:'line',data:{labels:hrs,datasets:[
  {label:'Consumption',data:hrAvg((d,h)=>TOT[d][h]),borderColor:'#0F8E98',pointRadius:0,borderWidth:2.2,tension:.3},
  {label:'Solar',data:hrAvg((d,h)=>SOL[d][h]),borderColor:'#F0A81B',backgroundColor:alpha('#F0A81B',.25),fill:true,pointRadius:0,borderWidth:2,tension:.3},
  {label:'Grid draw',data:hrAvg((d,h)=>Math.max(0,TOT[d][h]-SOL[d][h])),borderColor:'#5B73D6',borderDash:[5,4],pointRadius:0,borderWidth:2,tension:.3}]},
  options:base({plugins:{legend:{display:true}},scales:{x:{ticks:{maxTicksLimit:8}},y:ytitle('kWh per hour')}})});
 const dl=[...Array(DAYS).keys()].map(dayLbl);
 chart('cS2',{type:'bar',data:{labels:dl,datasets:[{label:'Solar',data:SOLDAY.map(Math.round),backgroundColor:'#F0A81B',stack:'s'},{label:'Grid (net)',data:DAYT.map((v,d)=>Math.round(v-SOLDAY[d])),backgroundColor:'#5B73D6',stack:'s'}]},
  options:base({plugins:{legend:{display:true},tooltip:{callbacks:stackTip(2)}},scales:{x:{stacked:true,ticks:{maxTicksLimit:10}},y:Object.assign({stacked:true},ytitle('kWh'))}})});
 chart('cS3',{type:'line',data:{labels:dl,datasets:[{data:SOLDAY.map((v,d)=>+(v/DAYT[d]*100).toFixed(1)),borderColor:'#1E8A5A',backgroundColor:alpha('#1E8A5A',.12),fill:true,pointRadius:2,borderWidth:2,tension:.25}]},options:base({scales:{x:{ticks:{maxTicksLimit:10}},y:ytitle('%')}})});
 chart('cS4',{type:'bar',data:{labels:dl,datasets:[{data:EXCDAY.map(Math.round),backgroundColor:alpha('#E0A21B',.85),borderRadius:3}]},options:base({scales:{x:{ticks:{maxTicksLimit:10}},y:ytitle('kWh')}})});
 const m12=MONTHLY.slice(12);
 chart('cS5',{type:'bar',data:{labels:m12.map((_,i)=>mLabel(i+12)),datasets:[{label:'Solar',data:m12.map((v,i)=>Math.round(v*SOLSH[i])),backgroundColor:'#F0A81B',stack:'s'},{label:'Grid (net)',data:m12.map((v,i)=>Math.round(v*(1-SOLSH[i]))),backgroundColor:'#5B73D6',stack:'s'}]},
  options:base({plugins:{legend:{display:true},tooltip:{callbacks:stackTip(2)}},scales:{x:{stacked:true},y:Object.assign({stacked:true},ytitle('kWh'))}})});
};

/* ---------- Forecast ---------- */
PG.forecast=()=>{
 const F=forecast(S.fc),pkd=F.days.reduce((a,x)=>x.p>a.p?x:a,F.days[0]);
 const wk=[];for(let i=0;i<F.days.length;i+=7)wk.push(F.days.slice(i,i+7));
 $('#view').innerHTML=`<div class="bar"><div class="seg" id="scSeg" role="group" aria-label="Scenario">${Object.keys(SC).map(k=>`<button data-s="${k}" class="${S.fc===k?'on':''}">${SC[k].n}</button>`).join('')}</div></div>`+
  `<div class="kpis">`+kpi('Expected next 30 days',fmt(F.total)+' kWh','1 to 30 October 2026','#6A5BB0')+
  kpi('Projected change',sgn(F.growth*100),'vs September','#D8443B')+
  kpi('Projected cost',inr(F.total*S.rate),`at ₹${S.rate.toFixed(2)}/kWh`,'#E0A21B','#cost')+
  kpi('Highest projected day',dayLbl2(pkd.t),fmt(pkd.p)+' kWh','#C2547A')+`</div>`+
  card('Historical data, trend and projected consumption','Daily kWh. The shaded band is a 90% range that widens further out.',box('cF',340),'stack')+
  `<div class="g2">`+card('Projection by week','',`<table><tr><th>Week</th><th class="n">Projected kWh</th><th class="n">Cost</th></tr>${wk.map(w=>`<tr><td>${dayLbl2(w[0].t)} to ${dayLbl2(w[w.length-1].t)}</td><td class="n">${fmt(sum(w.map(x=>x.p)))}</td><td class="n">${inrL(sum(w.map(x=>x.p))*S.rate)}</td></tr>`).join('')}</table>`)+
  card('How this is calculated','',`<p style="margin:0 0 8px">The model takes September’s average for each day of the week, then scales it by the average of the last three month-on-month growth rates, damped by 10% so it does not over-extrapolate (${sgn(F.g*100)} growth applied).</p><p style="margin:0">It runs entirely in your browser with plain JavaScript. A production version would add weather, production schedules and tariff changes.</p>`)+`</div>`;
 $('#scSeg').onclick=e=>{const s=e.target.dataset.s;if(s){S.fc=s;PG.forecast()}};
 const hl=[...Array(DAYS).keys()].map(dayLbl),fl=F.days.map(x=>dayLbl2(x.t)),labels=[...hl,...fl];
 const pad=a=>[...Array(DAYS).fill(null),...a],hist=[...DAYT.map(Math.round),...Array(30).fill(null)];
 const link=[...Array(DAYS-1).fill(null),Math.round(DAYT[DAYS-1]),...F.days.map(x=>Math.round(x.p))];
 chart('cF',{type:'line',data:{labels,datasets:[
  {label:'Lower bound',data:pad(F.days.map(x=>Math.round(x.lo))),borderColor:'transparent',pointRadius:0},
  {label:'Likely range',data:pad(F.days.map(x=>Math.round(x.hi))),borderColor:'transparent',backgroundColor:'rgba(106,91,176,.16)',pointRadius:0,fill:'-1'},
  {label:'Historical',data:hist,borderColor:'#0F8E98',borderWidth:2.2,pointRadius:0,tension:.2},
  {label:'Projected',data:link,borderColor:'#6A5BB0',borderDash:[6,4],borderWidth:2.2,pointRadius:0,tension:.2}]},
  options:base({plugins:{legend:{display:true,labels:{filter:i=>i.text!=='Lower bound'}}},scales:{x:{ticks:{maxTicksLimit:12}},y:Object.assign({beginAtZero:false},ytitle('kWh per day'))}})});
};
const dayLbl2=t=>t.getDate()+' '+M[t.getMonth()];

/* ---------- Sustainability ---------- */
PG.sustainability=()=>{
 const e1=co2(GRIDNET),e0=co2(MONTHLY[22]*(1-SOLSH[10])),ren=SOLTOT/TOTAL;
 const em=B.map((_,i)=>co2(BT[i]*(1-ren))),inten=B.map((b,i)=>BT[i]/b.area);
 const m12=MONTHLY.slice(12);
 $('#view').innerHTML=`<div class="kpis">`+kpi('Estimated CO₂',f1(e1)+' t','after solar, September 2026','#1E8A5A')+
  kpi('Change vs August',dlt((e1/e0-1)*100,true),f1(e0)+' t in August','#0F8E98')+
  kpi('Renewable contribution',pct(ren),'rooftop solar','#F0A81B','#solar')+
  kpi('Energy intensity',f1(TOTAL/sum(B.map(b=>b.area)))+' kWh/m²','per month, all floor area','#5B73D6')+`</div>`+
  `<div class="g2">`+card('Monthly emissions trend','Tonnes CO₂, last 12 months',box('cM',280))+card('Renewable share','Percent of consumption covered by solar',box('cR',280))+`</div>`+
  `<div class="g2">`+card('Emissions by location','Tonnes CO₂ this month, solar shared pro rata',box('cEm',260))+card('Energy intensity by location','kWh per m² this month',box('cIn',260))+`</div>`+
  foot(`Demo estimates only. Emissions use an illustrative grid factor of ${EF} kg CO₂ per kWh applied to grid consumption, and floor areas are fictional.`);
 chart('cM',{type:'bar',data:{labels:m12.map((_,i)=>mLabel(i+12)),datasets:[{data:m12.map((v,i)=>+co2(v*(1-SOLSH[i])).toFixed(1)),backgroundColor:m12.map((_,i)=>i===11?'#1E8A5A':alpha('#1E8A5A',.45)),borderRadius:3}]},options:base({scales:{y:ytitle('tonnes CO₂')}})});
 chart('cR',{type:'line',data:{labels:m12.map((_,i)=>mLabel(i+12)),datasets:[{data:SOLSH.map(v=>+(v*100).toFixed(1)),borderColor:'#F0A81B',backgroundColor:alpha('#F0A81B',.18),fill:true,borderWidth:2.4,pointRadius:3,tension:.3}]},options:base({scales:{y:ytitle('%')}})});
 chart('cEm',{type:'bar',data:{labels:B.map(b=>b.short),datasets:[{data:em.map(v=>+v.toFixed(1)),backgroundColor:B.map(b=>b.color),borderRadius:3}]},options:base({scales:{y:ytitle('tonnes CO₂')}})});
 chart('cIn',{type:'bar',data:{labels:B.map(b=>b.short),datasets:[{data:inten.map(v=>+v.toFixed(1)),backgroundColor:B.map(b=>b.color),borderRadius:3}]},options:base({scales:{y:ytitle('kWh/m²')}})});
};

/* ---------- Insights ---------- */
PG.insights=()=>{
 $('#view').innerHTML=`<div class="insgrid">${insights().map(insCard).join('')}</div>`+
  foot('Each observation is computed from the fictional dataset when this page opens. Change the tariff, anomaly sensitivity or peak window and the wording and numbers update.');
};

applyTheme();
render();
})();
</script>
</body>
</html>
